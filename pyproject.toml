[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kanban"
version = "0.6.0"
requires-python = ">=3.13"
dependencies = ["rich", "textual"]
authors = [
    {name = "Philip Dow"}
]
description = "Kanban on the terminal"
readme = "README.md"
keywords = ["kanban", "task", "todo"]
license = "MIT"

[project.scripts]
kanban = "kanban.main:main"

[project.optional-dependencies]
dev = ["mypy>=1.11", "pytest>=8", "pytest-xdist>=3.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
kanban = ["tui/*.tcss", "KANBAN.md"]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
show_error_codes = true
pretty = true
warn_unused_ignores = true
ignore_missing_imports = true
